name: CI

on:
  push:
  pull_request:

env:
  # Day 9/10/11's own rule, enforced here too: never call a real
  # external LLM provider in CI. "mock" needs zero credentials and
  # makes zero network calls -- see src/llm/mock_provider.py.
  LLM_PROVIDER: mock

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src/ storage/ training/ evaluation/ tests/

      - name: Unit tests
        run: pytest tests/ -q -k "not test_llm_gateway and not test_safety and not test_copilot_eval and not test_copilot_service"

      - name: LLM gateway tests
        run: pytest tests/test_llm_gateway.py -q

      - name: Safety tests
        run: pytest tests/test_safety.py tests/test_copilot_service.py tests/test_copilot_eval.py -q

      # tests/test_api_integration.py is included above (no -k exclusion
      # for it) -- it self-skips via pytest.mark.skipif when real model
      # checkpoints aren't present, which is always true in CI (the
      # .pth files are gitignored, never committed). Real weights are
      # only exercised in local/manual runs, per Day 8's own convention.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t medical-imaging-backend:ci .

      - name: Build frontend image
        run: docker build -t medical-imaging-frontend:ci ./frontend

      # No deploy step: no hosting target has been set up for this
      # portfolio project (Section 37's deployment guidance is
      # preparation, not a live target) -- adding one here would either
      # do nothing real or silently need secrets that don't exist.
      # Wire this in only once there's an actual place to deploy to.
