server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing -- any unknown path falls back to
    # index.html so /reports/abc123 works on a hard refresh, not just
    # client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same relative-path convention as vite.config.ts's dev-server proxy
    # -- the frontend always calls /api/v1/..., so the same nginx config
    # works whether "backend" resolves via Docker Compose's internal DNS
    # or (with an env-specific override) an external host.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
